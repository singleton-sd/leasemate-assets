# Immutable /releases/<tag>/ snapshot + GitHub Release archives.
# Triggered by the GitHub Release that release.yml opens — not by tag push —
# because the release commit message contains `[skip ci]`.
# Latest catalog (site root) is pages.yml from main — this job never
# deploys a tagged dist there, including workflow_dispatch backfills.
#
# Build is unauthenticated (contents: read, no secrets). Publish checks out
# for JamesIves and gh, downloads artifacts, verifies the tag and archives
# with bash/git/jq (no node/pnpm/npx), then mints the singleton-release
# App token as its last setup step and uses it for `gh release upload` and
# the gh-pages snapshot — never GITHUB_TOKEN.
name: Publish version snapshot

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to snapshot (unprefixed or vX.Y.Z)
        required: true
        type: string

concurrency:
  group: pages-publish
  cancel-in-progress: false
  # Same group as pages.yml. queue: max keeps this snapshot pending instead
  # of replacing it when another Pages run arrives while one is in progress.
  queue: max

permissions:
  contents: read

jobs:
  build:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.release.prerelease == false) }}
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Parse stable tag
        id: tag
        env:
          TAG: ${{ env.SNAPSHOT_TAG }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          version="${TAG#v}"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "${TAG} is not a stable semver tag."
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
          DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [[ "$(git rev-parse HEAD)" == "${commit}" ]] || fail "Checked-out commit is not tag ${TAG}."
          [[ "$(git log -1 --format=%s "${commit}")" == "chore(release): v${VERSION} [skip ci]" ]] \
            || fail "${TAG} is not on a chore(release) commit."
          git merge-base --is-ancestor "${commit}" "refs/remotes/origin/${DEFAULT_BRANCH}" \
            || fail "${TAG} is not on ${DEFAULT_BRANCH}."

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm build
        env:
          CI: "true"

      - name: Reject an existing version snapshot
        env:
          TAG: ${{ env.SNAPSHOT_TAG }}
        run: |
          set -euo pipefail
          version="$(node scripts/release-snapshot.mjs parse "$TAG")"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/releases/${version}?ref=gh-pages")"
          node scripts/release-snapshot.mjs assert-absent "$status" "$TAG"

      - name: Package generated assets
        id: pkg
        env:
          TAG: ${{ env.SNAPSHOT_TAG }}
        run: |
          set -euo pipefail
          version="$(node scripts/release-snapshot.mjs parse "$TAG")"
          asset_id="$(node -p "JSON.parse(require('fs').readFileSync('config/product.json','utf8')).id")"
          archive="$(node scripts/release-snapshot.mjs archive-name "$asset_id" "$TAG")"
          tar -czf "$archive" -C dist .
          sha256sum "$archive" > "${archive}.sha256"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-archives
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.release.prerelease == false) }}
    environment: release
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          version="${TAG#v}"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "${TAG} is not a stable semver tag."
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [[ "$(git rev-parse HEAD)" == "${commit}" ]] || fail "Checked-out commit is not tag ${TAG}."
          [[ "$(git log -1 --format=%s "${commit}")" == "chore(release): v${version} [skip ci]" ]] \
            || fail "${TAG} is not on a chore(release) commit."
          git merge-base --is-ancestor "${commit}" "refs/remotes/origin/${DEFAULT_BRANCH}" \
            || fail "${TAG} is not on ${DEFAULT_BRANCH}."
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: snapshot-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: snapshot-archives
          path: ${{ runner.temp }}/snapshot-archives
      - name: Verify snapshot archives
        id: archive
        env:
          TAG: ${{ env.SNAPSHOT_TAG }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          files="${RUNNER_TEMP}/snapshot-archives"
          product_id="$(git show "HEAD:config/product.json" | jq -r '.id')"
          [[ "${product_id}" =~ ^[a-z][a-z0-9-]*$ ]] || fail "product id '${product_id}' is not a safe slug."
          archive="${product_id}-assets-${VERSION}.tar.gz"
          listing="$(cd "${files}" && find . -mindepth 1 -printf '%y %P\n' | LC_ALL=C sort)"
          want="$(printf 'f %s\n' "${archive}" "${archive}.sha256" | LC_ALL=C sort)"
          [[ "${listing}" == "${want}" ]] || fail "Unexpected archive contents: ${listing//$'\n'/, }"
          [[ -f "${files}/${archive}" && ! -L "${files}/${archive}" ]] \
            || fail "${archive} is not a regular file."
          [[ -f "${files}/${archive}.sha256" && ! -L "${files}/${archive}.sha256" ]] \
            || fail "${archive}.sha256 is not a regular file."
          (cd "${files}" && sha256sum --check --strict "${archive}.sha256")
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: leasemate-assets
          permission-contents: write
      - name: Attach archive, checksum, and manifest to the GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.SNAPSHOT_TAG }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          set -euo pipefail
          files="${RUNNER_TEMP}/snapshot-archives"
          gh release upload "$RELEASE_TAG" \
            "${files}/${ARCHIVE}" \
            "${files}/${ARCHIVE}.sha256" \
            dist/manifest.json \
            -R "$GH_REPO"
      # Site root (latest catalog) is published from main by pages.yml.
      # A tagged historical backfill must not deploy its dist to root.
      - name: Publish immutable version directory
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          folder: dist
          target-folder: releases/${{ steps.tag.outputs.version }}
          clean: false
          force: false
