# Latest catalog on gh-pages. Immutable /releases/<tag>/ snapshots are
# published from snapshot.yml on `release: published` (not tag push: the
# release commit is `chore(release): vX [skip ci]`).
name: Publish Pages catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm build
        env:
          CI: "true"
      - name: Publish current catalog
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            releases
            CNAME
