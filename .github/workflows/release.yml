# Release: bump version + CHANGELOG.md, commit and push to main, tag,
# publish to npm (OIDC Trusted Publishing), and open a GitHub Release.
#
# The push to main uses the singleton-release GitHub App, which Pato adds
# to the default-branch ruleset bypass list. Never use secrets.GITHUB_TOKEN
# or a PAT for that push (GITHUB_TOKEN cannot bypass the CodeRabbit ruleset).
#
# prepare: checkout, install, validate/test/build/sync, and bump files with
# no App token and no secrets. publish: no install / no node scripts; mint
# the App token last, then git push via extraheader, npm publish
# --ignore-scripts, and gh release create.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read # default token is not used for the push

jobs:
  prepare:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release revision
        id: revision
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout -B main origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          # Do NOT set registry-url — breaks OIDC Trusted Publishing.

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate, test, build, and sync
        run: |
          set -euo pipefail
          pnpm sync:legacy-svg
          pnpm validate
          pnpm test
          pnpm build

      - name: Bump version and changelog
        id: bump
        run: |
          set -euo pipefail
          pnpm release:bump
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          npm pack --ignore-scripts
          {
            echo "📦 [\`@singleton-sd/leasemate-assets@${version}\`](https://www.npmjs.com/package/@singleton-sd/leasemate-assets/v/${version})"
            echo
            awk '/^## / { if (found) exit; found=1 } found { print }' CHANGELOG.md
          } > release-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            package.json
            CHANGELOG.md
            release-notes.md
            singleton-sd-leasemate-assets-${{ steps.bump.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Point local main at the prepared revision
        env:
          PREPARE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREPARE_SHA"
          git checkout -B main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: release-files

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          # Do NOT set registry-url — breaks OIDC Trusted Publishing.

      - name: Upgrade npm for OIDC publish
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1
          npm --version
          for npmrc in "$PWD/.npmrc" "$(npm config get userconfig)" "$(npm config get globalconfig)"; do
            if [[ -f "$npmrc" ]] && grep -qE 'always-auth|^//registry\.npmjs\.org|_authToken' "$npmrc"; then
              echo "Refusing to publish with an auth .npmrc: $npmrc" >&2
              exit 1
            fi
          done

      - name: Apply bump, commit, and tag
        id: release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREPARE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${VERSION}:refs/tags/${VERSION}" || true
          plan="$(node scripts/release-resume.mjs plan "$VERSION" "$PREPARE_SHA")"
          echo "plan=${plan}" >> "$GITHUB_OUTPUT"
          if [[ "$plan" == "resume" ]]; then
            git checkout -B main "${VERSION}^{commit}"
            exit 0
          fi
          if [[ "$plan" != "create" ]]; then
            echo "::error::unexpected release plan: ${plan}" >&2
            exit 1
          fi
          cp release-files/package.json package.json
          cp release-files/CHANGELOG.md CHANGELOG.md
          # singleton-release[bot] user id 356768209 — static so commit
          # does not look up the bot over the API before the App token exists.
          git config user.name "singleton-release[bot]"
          git config user.email "356768209+singleton-release[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit --no-verify -m "chore(release): v${VERSION} [skip ci]"
          git tag -a "${VERSION}" -m "v${VERSION}"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: leasemate-assets
          permission-contents: write

      - name: Push release commit and tag
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLAN: ${{ steps.release.outputs.plan }}
        run: |
          set -euo pipefail
          if [[ "$PLAN" == "resume" ]]; then
            echo "tag ${VERSION} already on origin; skip push"
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --atomic --no-verify origin HEAD:main "refs/tags/${VERSION}"

      - name: Publish to npm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@singleton-sd/leasemate-assets@${VERSION}" version >/dev/null 2>&1; then
            echo "npm already has ${VERSION}"
            exit 0
          fi
          npm publish \
            "release-files/singleton-sd-leasemate-assets-${VERSION}.tgz" \
            --ignore-scripts \
            --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "GitHub Release ${VERSION} already exists"
            exit 0
          fi
          gh release create "${VERSION}" \
            --title "v${VERSION}" \
            --target main \
            --notes-file release-files/release-notes.md \
            -R "$GH_REPO"
