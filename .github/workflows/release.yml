# Release: bump version + CHANGELOG.md, commit and push to main, tag,
# publish to npm (OIDC Trusted Publishing), and open a GitHub Release.
#
# The push to main uses the singleton-release GitHub App, which Pato adds
# to the default-branch ruleset bypass list. Never use secrets.GITHUB_TOKEN
# or a PAT for that push (GITHUB_TOKEN cannot bypass the CodeRabbit ruleset).
#
# prepare: checkout, install, validate/test/build/sync, and bump files with
# no App token and no secrets. publish: no install / no repo scripts; mint
# the App token last, then git push via extraheader, gh release create, and
# npm publish --ignore-scripts.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read # default token is not used for the push
  id-token: write # npm Trusted Publishing (OIDC) on the publish job

jobs:
  prepare:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release revision
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout -B main origin/main

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          # Do NOT set registry-url — breaks OIDC Trusted Publishing.

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate, test, build, and sync
        run: |
          set -euo pipefail
          pnpm sync:legacy-svg
          pnpm validate
          pnpm test
          pnpm build

      - name: Bump version and changelog
        id: bump
        run: |
          set -euo pipefail
          pnpm release:bump
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          npm pack --ignore-scripts
          {
            echo "Release v${version}."
            echo
            echo "📦 [\`@singleton-sd/leasemate-assets@${version}\`](https://www.npmjs.com/package/@singleton-sd/leasemate-assets/v/${version})"
          } > release-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            package.json
            CHANGELOG.md
            release-notes.md
            singleton-sd-leasemate-assets-${{ steps.bump.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select main
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout -B main origin/main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: release-files

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          # Do NOT set registry-url — breaks OIDC Trusted Publishing.

      - name: Upgrade npm for OIDC publish
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1
          npm --version
          for npmrc in "$PWD/.npmrc" "$(npm config get userconfig)" "$(npm config get globalconfig)"; do
            if [[ -f "$npmrc" ]] && grep -qE 'always-auth|^//registry\.npmjs\.org|_authToken' "$npmrc"; then
              echo "Refusing to publish with an auth .npmrc: $npmrc" >&2
              exit 1
            fi
          done

      - name: Apply bump, commit, and tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp release-files/package.json package.json
          cp release-files/CHANGELOG.md CHANGELOG.md
          user_id="$(curl -fsSL --globoff \
            -H "Authorization: Bearer ${GH_API_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/singleton-release[bot]" | jq -r .id)"
          if [[ -z "${user_id}" || "${user_id}" == "null" ]]; then
            echo "::error::Could not resolve GitHub user id for singleton-release[bot]." >&2
            exit 1
          fi
          git config user.name "singleton-release[bot]"
          git config user.email "${user_id}+singleton-release[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit --no-verify -m "chore(release): v${VERSION} [skip ci]"
          git tag "${VERSION}"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: leasemate-assets
          permission-contents: write

      - name: Push release commit and tag
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:main --follow-tags --atomic --no-verify

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            --title "v${VERSION}" \
            --target main \
            --notes-file release-files/release-notes.md

      - name: Publish to npm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm publish \
            "release-files/singleton-sd-leasemate-assets-${VERSION}.tgz" \
            --ignore-scripts \
            --access public
